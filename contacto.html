<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto - Lo quieres, te lo vendo</title>

    <!-- CSS compartido con index.html -->
    <link rel="stylesheet" href="assets/style.css">
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous">

</head>

<body>

    <!-- Encabezado -->
    <header>

        <h1 style="font-family: Arial; font-size: 10px;">
            Lo quieres, te lo vendo
        </h1>

        <!-- Menú principal -->
        <nav>

            <a href="index.html">Inicio</a>

            <a href="index.html#productos">Productos</a>

            <a href="contacto.html">Contacto</a>

        </nav>

    </header>


    <!-- Contenido principal -->
    <main>

        <section class="contacto">

            <h2>Contáctanos</h2>

            <p class="descripcion-contacto">
                Si tienes alguna consulta sobre nuestros productos o pedidos,
                completa el siguiente formulario y nos pondremos en contacto contigo.
            </p>


            <!-- Formulario de contacto -->
            <form class="formulario" action="#" method="post">

                <!-- Nombre -->
                <label for="nombre">
                    Nombre completo
                </label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Ingrese su nombre"
                    autocomplete="name"
                    minlength="3"
                    maxlength="60"
                    required
                >


                <!-- Correo -->
                <label for="correo">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="ejemplo@correo.com"
                    autocomplete="email"
                    maxlength="100"
                    required
                >


                <!-- Mensaje -->
                <label for="mensaje">
                    Mensaje
                </label>

                <textarea
                    id="mensaje"
                    name="mensaje"
                    rows="6"
                    placeholder="Escriba su mensaje aquí..."
                    minlength="10"
                    maxlength="500"
                    required
                ></textarea>


                <!-- Botón -->
                <button type="submit">
                    Enviar mensaje
                </button>

            </form>

        </section>

    </main>


    <!-- Pie de página -->
    <footer>

        <p>
            Equipo Lo quieres, te lo vendo &copy; 2026
        </p>

    </footer>

</body>

</html>
